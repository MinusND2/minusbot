<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Modstats</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 24px;
      position: relative;
    }
    
    /* Animated grid background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(245, 197, 24, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 197, 24, 0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    /* Gold glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.5;
    }
    .orb-1 { width: 500px; height: 500px; background: rgba(245, 197, 24, 0.06); top: -150px; right: -100px; }
    .orb-2 { width: 450px; height: 450px; background: rgba(167, 129, 4, 0.04); bottom: -100px; left: -80px; }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid rgba(245, 197, 24, 0.15);
      border-radius: 20px;
      background: #0c0c0e;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }
    
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(95deg, #f5c518 0%, #a78104 100%);
    }

    h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f5c518 0%, #a78104 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    input {
      font-family: inherit;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #f5c518;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(245, 197, 24, 0.1);
    }

    button {
      font-family: inherit;
      min-height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f5c518, #a78104);
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: 700;
      padding: 10px 24px;
      transition: all 0.2s;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(245, 197, 24, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }
    
    th {
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
    }
    
    td {
      color: #e4e4e7;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .muted { 
      color: #a1a1aa; 
      font-size: 14px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="card">
    <h2 style="margin-top:0;">Twitch Modstats</h2>
    <p class="muted">Zeigt Timeouts/Bans pro Moderator. API-Quelle ist der Bot-Server.</p>
    <div class="row">
      <input id="apiBase" type="text" placeholder="API Base, z.B. http://87.106.195.67:8787" style="flex: 1 1 260px;">
      <input id="broadcasterId" type="text" placeholder="Broadcaster ID (optional)" style="flex: 1 1 220px;">
    </div>
    <div class="row">
      <input id="fromInput" type="datetime-local" style="flex: 1 1 220px;">
      <input id="toInput" type="datetime-local" style="flex: 1 1 220px;">
      <button id="loadBtn" type="button">Laden</button>
    </div>
    <div id="status" class="muted"></div>
    <table>
      <thead>
        <tr>
          <th>Moderator</th>
          <th>Timeouts</th>
          <th>Bans</th>
          <th>Gesamt</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const apiBaseEl = document.getElementById("apiBase");
    const broadcasterIdEl = document.getElementById("broadcasterId");
    const fromInputEl = document.getElementById("fromInput");
    const toInputEl = document.getElementById("toInput");
    const loadBtn = document.getElementById("loadBtn");
    const rowsEl = document.getElementById("rows");
    const statusEl = document.getElementById("status");

    apiBaseEl.value = localStorage.getItem("modstatsApiBase") || "http://87.106.195.67:8787";
    broadcasterIdEl.value = localStorage.getItem("modstatsBroadcasterId") || "";

    function fmtNumber(v) {
      return Number(v || 0).toLocaleString("de-DE");
    }

    function toIsoOrEmpty(value) {
      if (!value) return "";
      const ts = new Date(value).toISOString();
      return ts;
    }

    async function loadSummary() {
      rowsEl.innerHTML = "";
      statusEl.textContent = "Lade...";
      const base = apiBaseEl.value.trim().replace(/\/+$/, "");
      const broadcasterId = broadcasterIdEl.value.trim();
      localStorage.setItem("modstatsApiBase", base);
      localStorage.setItem("modstatsBroadcasterId", broadcasterId);

      const params = new URLSearchParams();
      if (broadcasterId) params.set("broadcaster_id", broadcasterId);
      if (fromInputEl.value) params.set("from", toIsoOrEmpty(fromInputEl.value));
      if (toInputEl.value) params.set("to", toIsoOrEmpty(toInputEl.value));

      const url = `${base}/api/modstats/summary?${params.toString()}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const items = Array.isArray(data.moderators) ? data.moderators : [];
        if (!items.length) {
          statusEl.textContent = "Keine Daten im gewaehlten Zeitraum.";
          return;
        }
        items.forEach((it) => {
          const tr = document.createElement("tr");
          const total = Number(it.timeouts || 0) + Number(it.bans || 0);
          tr.innerHTML = `
            <td>${it.moderatorName || it.moderatorLogin || it.moderatorId}</td>
            <td>${fmtNumber(it.timeouts)}</td>
            <td>${fmtNumber(it.bans)}</td>
            <td>${fmtNumber(total)}</td>
          `;
          rowsEl.appendChild(tr);
        });
        statusEl.textContent = `OK: ${items.length} Moderatoren`;
      } catch (err) {
        statusEl.textContent = "Fehler beim Laden: " + (err.message || err);
      }
    }

    loadBtn.addEventListener("click", loadSummary);
    loadSummary();
  </script>
</body>
</html>
