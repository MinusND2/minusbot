<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap');

        :root {
            --sb-bg: rgba(12, 16, 33, 0.7);
            --sb-border: rgba(255, 255, 255, 0.15);
            --sb-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            --sb-home-a: #2563eb;
            --sb-home-b: #1d4ed8;
            --sb-away-a: #dc2626;
            --sb-away-b: #b91c1c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Outfit', -apple-system, sans-serif;
            overflow: hidden;
        }

        .scoreboard {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            align-items: stretch;
            height: 58px;
            width: 500px;
            border: 1px solid var(--sb-border);
            box-shadow: var(--sb-shadow);
            border-radius: 16px;
            overflow: hidden;
            color: white;
            font-weight: 700;
            background: var(--sb-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 15px;
            width: 205px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            min-width: 0;
            position: relative;
            overflow: hidden;
        }
        
        .team::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        .home {
            background: linear-gradient(135deg, var(--sb-home-a) 0%, var(--sb-home-b) 100%);
            justify-content: flex-start;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .away {
            background: linear-gradient(135deg, var(--sb-away-a) 0%, var(--sb-away-b) 100%);
            justify-content: flex-end;
            border-left: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }

        .team-logo {
            height: 38px;
            width: 38px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            flex: 0 0 auto;
            z-index: 1;
        }

        .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            line-height: 1.1;
            display: block;
            min-width: 0;
            z-index: 1;
        }
        
        .home .team-logo { margin-right: 12px; }
        .away .team-logo { margin-left: 12px; order: 2; }

        .score-container {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            font-size: 24px;
            min-width: 86px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        .score {
            font-weight: 900;
            min-width: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #fff 20%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .divider {
            color: rgba(255,255,255,0.3);
            font-size: 18px;
            font-weight: 700;
            margin-top: -2px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="team home">
            <img id="logoHome" src="" alt="Home" class="team-logo">
            <span id="nameHome" class="team-name">HOME</span>
        </div>
        
        <div class="score-container">
            <span id="scoreHome" class="score">0</span>
            <span class="divider">-</span>
            <span id="scoreAway" class="score">0</span>
        </div>

        <div class="team away">
            <span id="nameAway" class="team-name">AWAY</span>
            <img id="logoAway" src="" alt="Away" class="team-logo">
        </div>
    </div>

    <script src="app-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="realtime-store.js"></script>
    <script>
        const scoreboardEl = document.querySelector('.scoreboard');
        const homeTeamEl = document.querySelector('.team.home');
        const awayTeamEl = document.querySelector('.team.away');
        const scoreContainerEl = document.querySelector('.score-container');
        const scoreHome = document.getElementById('scoreHome');
        const scoreAway = document.getElementById('scoreAway');
        
        const nameHome = document.getElementById('nameHome');
        const logoHome = document.getElementById('logoHome');
        const nameAway = document.getElementById('nameAway');
        const logoAway = document.getElementById('logoAway');

        BingoStore.subscribe((data) => {
            updateScore(data.score);
            updateTeams(data.teams);
            updateStyle(data.scoreboardStyle);
        }, new URLSearchParams(window.location.search).get('stream') || (window.BINGO_CONFIG && window.BINGO_CONFIG.streamId) || 'default-stream');

        function updateScore(score) {
            scoreHome.textContent = score.home;
            scoreAway.textContent = score.away;
        }

        function updateTeams(teams) {
            if(teams.home) {
                nameHome.textContent = teams.home.name;
                logoHome.src = teams.home.logo;
            }
            if(teams.away) {
                nameAway.textContent = teams.away.name;
                logoAway.src = teams.away.logo;
            }
            requestAnimationFrame(() => {
                fitTeamName(nameHome, homeTeamEl);
                fitTeamName(nameAway, awayTeamEl);
            });
        }

        function updateStyle(style) {
            if (!style) return;
            scoreboardEl.style.left = `${style.posX ?? 40}px`;
            scoreboardEl.style.top = `${style.posY ?? 40}px`;
            scoreboardEl.style.width = `${style.totalWidth ?? 460}px`;
            scoreboardEl.style.height = `${style.height ?? 58}px`;
            scoreboardEl.style.borderRadius = `${style.radius ?? 14}px`;

            const dynamicTeamWidth = computeTeamWidth(style);
            homeTeamEl.style.width = `${dynamicTeamWidth}px`;
            awayTeamEl.style.width = `${dynamicTeamWidth}px`;
            homeTeamEl.style.fontSize = `${style.teamFontSize ?? 15}px`;
            awayTeamEl.style.fontSize = `${style.teamFontSize ?? 15}px`;
            scoreContainerEl.style.fontSize = `${style.scoreFontSize ?? 22}px`;
            requestAnimationFrame(() => {
                fitTeamName(nameHome, homeTeamEl);
                fitTeamName(nameAway, awayTeamEl);
            });

            const scale = style.scale ?? 1;
            scoreboardEl.style.transform = `scale(${scale})`;
            scoreboardEl.style.transformOrigin = 'top left';
        }

        function computeTeamWidth(style) {
            const total = Number(style?.totalWidth ?? 460);
            const score = Math.max(78, scoreContainerEl.offsetWidth || 88);
            const side = Math.floor((total - score) / 2);
            return Math.max(150, side);
        }

        function fitTeamName(nameEl, teamEl) {
            const base = parseFloat(teamEl.style.fontSize || getComputedStyle(teamEl).fontSize || "15");
            let size = base;
            nameEl.style.fontSize = `${size}px`;
            nameEl.style.letterSpacing = "0.4px";
            nameEl.style.maxHeight = "100%";

            // Keep one line and shrink until full text fits.
            while (nameEl.scrollWidth > nameEl.clientWidth && size > 8) {
                size -= 0.5;
                nameEl.style.fontSize = `${size}px`;
            }
        }
    </script>
</body>
</html>
