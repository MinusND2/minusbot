<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Stream Hearts Overlay</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playball&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../app-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent !important;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            height: 100vh;
            width: 100vw;
            padding: 24px;
        }

        .hearts-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .heart-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px 8px 8px;
            border-radius: 50px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateX(40px);
            animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: all 0.4s ease;
        }

        .heart-row:hover {
            transform: translateX(-4px) scale(1.02);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease;
        }

        .avatar-glow {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255, 70, 130, 0.4),
                rgba(255, 100, 180, 0.1),
                rgba(255, 70, 130, 0.4)
            );
            animation: avatarGlowSpin 4s linear infinite;
            opacity: 0.6;
            z-index: -1;
        }

        @keyframes avatarGlowSpin {
            to { transform: rotate(360deg); }
        }

        .name-label {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hearts-group {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-left: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 240px;
        }

        .heart-icon {
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 1px 4px rgba(255, 50, 100, 0.5));
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .heart-icon.filled {
            animation: heartPulse 1.8s ease-in-out infinite;
        }

        .heart-icon.empty {
            opacity: 0.2;
            filter: grayscale(1) drop-shadow(0 0 0 transparent);
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.18); }
            30% { transform: scale(1); }
        }

        /* Stagger pulse animation for each heart */
        .heart-icon.filled:nth-child(1) { animation-delay: 0s; }
        .heart-icon.filled:nth-child(2) { animation-delay: 0.15s; }
        .heart-icon.filled:nth-child(3) { animation-delay: 0.3s; }
        .heart-icon.filled:nth-child(4) { animation-delay: 0.45s; }
        .heart-icon.filled:nth-child(5) { animation-delay: 0.6s; }

        /* Stagger the slide-in for each row */
        .heart-row:nth-child(1) { animation-delay: 0s; }
        .heart-row:nth-child(2) { animation-delay: 0.1s; }
        .heart-row:nth-child(3) { animation-delay: 0.2s; }
        .heart-row:nth-child(4) { animation-delay: 0.3s; }
        .heart-row:nth-child(5) { animation-delay: 0.4s; }
        .heart-row:nth-child(6) { animation-delay: 0.5s; }
        .heart-row:nth-child(7) { animation-delay: 0.6s; }
        .heart-row:nth-child(8) { animation-delay: 0.7s; }
        .heart-row:nth-child(9) { animation-delay: 0.8s; }
        .heart-row:nth-child(10) { animation-delay: 0.9s; }

        .no-data-msg {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 600;
            background: rgba(10, 10, 20, 0.6);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* ─── Fantasy Theme (Anime Sunset & Butterflies) ─── */
        body.theme-fantasy {
            padding: 16px;
        }

        .theme-fantasy .hearts-container {
            gap: 22px; /* Extra space between rows for floating decorations */
        }

        /* Fully transparent - no background box */
        .theme-fantasy .heart-row {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 2px 6px 2px 2px !important;
            box-shadow: none !important;
            gap: 6px !important;
            position: relative;
            overflow: visible;
        }

        .theme-fantasy .heart-row::before {
            display: none !important;
        }

        .theme-fantasy .heart-row:hover {
            transform: none !important;
            box-shadow: none !important;
        }

        /* Compact cursive glowing name label */
        .theme-fantasy .name-label {
            font-family: 'Playball', 'Great Vibes', cursive !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            color: #ffffff;
            text-shadow: 
                0 0 4px #ffd700, 
                0 0 8px #ff7a00,
                0 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.3px;
            max-width: 150px;
            overflow: visible !important;
        }

        /* Smaller avatar - forced */
        .theme-fantasy .avatar {
            border: 1.5px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            box-shadow: none !important;
        }

        .theme-fantasy .avatar-wrapper {
            width: 24px !important;
            height: 24px !important;
            min-width: 24px !important;
        }

        .theme-fantasy .avatar-glow {
            display: none !important;
        }

        /* Smaller hearts - forced */
        .theme-fantasy .heart-icon {
            width: 14px !important;
            height: 14px !important;
        }

        /* Floating glowing butterfly particles - compact */
        .butterfly {
            position: absolute;
            font-size: 10px;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7)) drop-shadow(0 0 2px #ffd700);
            opacity: 0.85;
            z-index: 10;
        }

        .b1 {
            top: -12px;
            left: 20%;
            animation: floatButterfly1 6s ease-in-out infinite alternate;
        }

        .b2 {
            bottom: -10px;
            right: 15%;
            animation: floatButterfly2 7s ease-in-out infinite alternate;
        }

        .b3 {
            top: 50%;
            left: -16px;
            transform: translateY(-50%);
            animation: floatButterfly3 8s ease-in-out infinite alternate;
        }

        @keyframes floatButterfly1 {
            0% { transform: translate(0, 0) rotate(-15deg) scale(0.95); }
            100% { transform: translate(8px, -10px) rotate(12deg) scale(1.1); }
        }

        @keyframes floatButterfly2 {
            0% { transform: translate(0, 0) rotate(22deg) scale(1.05); }
            100% { transform: translate(-10px, 8px) rotate(-8deg) scale(0.9); }
        }

        @keyframes floatButterfly3 {
            0% { transform: translateY(-50%) translate(0, 0) rotate(3deg); }
            100% { transform: translateY(-50%) translate(6px, 6px) rotate(-12deg); }
        }

        /* Floating sparkling stars (Sternchen) - compact */
        .star {
            position: absolute;
            font-size: 7px;
            color: #ffffff;
            pointer-events: none;
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8));
            animation: sparkleStar 3s ease-in-out infinite alternate;
            z-index: 9;
        }

        .s1 {
            top: -7px;
            left: 10%;
            animation-delay: 0s;
        }

        .s2 {
            bottom: -6px;
            left: 40%;
            font-size: 5px;
            animation-delay: 0.6s;
        }

        .s3 {
            top: -8px;
            right: 28%;
            font-size: 8px;
            animation-delay: 1.2s;
        }

        .s4 {
            bottom: -7px;
            right: 6%;
            font-size: 6px;
            animation-delay: 1.8s;
        }

        @keyframes sparkleStar {
            0% { opacity: 0.25; transform: scale(0.7) rotate(0deg); }
            100% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartsContainer">
        <!-- Dynamic rows go here -->
    </div>

    <script>
        const HEART_SVG_FILLED = `<svg class="heart-icon filled" viewBox="0 0 24 24" fill="#ff3366" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        const HEART_SVG_EMPTY = `<svg class="heart-icon empty" viewBox="0 0 24 24" fill="#ff3366" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

        const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'%3E%3Ccircle cx='12' cy='8' r='4'/%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3C/svg%3E";

        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('profileId');

        if (!profileId) {
            document.body.innerHTML = "<div style='color: white; font-size: 20px; font-weight: 600; padding: 20px; background: rgba(0,0,0,0.8); border-radius: 10px;'>Fehlende profileId in der URL.</div>";
        } else {
            // Initialize Firebase
            if (!firebase.apps.length) {
                firebase.initializeApp(window.BINGO_CONFIG.firebaseConfig);
            }
            const db = firebase.database();
            const containerEl = document.getElementById("heartsContainer");

            db.ref(`general_profiles/${profileId}/hearts`).on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const maxHearts = parseInt(data.maxHearts, 10) || 3;
                const heartColor = data.heartColor || "#ff3366";
                const theme = data.theme || "standard";
                const entries = data.entries || {};

                // Update theme class on body
                document.body.className = "";
                document.body.classList.add(`theme-${theme}`);

                // Convert entries object to sorted array
                const people = Object.keys(entries)
                    .map(key => ({
                        id: key,
                        name: entries[key].name || "Unbekannt",
                        imageUrl: entries[key].imageUrl || "",
                        currentHearts: Math.max(0, Math.min(maxHearts, parseInt(entries[key].currentHearts, 10) || 0)),
                        order: parseInt(entries[key].order, 10) || 0
                    }))
                    .sort((a, b) => a.order - b.order);

                renderHearts(people, maxHearts, heartColor, theme);
            });

            function renderHearts(people, maxHearts, heartColor, theme) {
                containerEl.innerHTML = "";

                if (people.length === 0) {
                    containerEl.innerHTML = `<div class="no-data-msg">Keine Einträge vorhanden</div>`;
                    return;
                }

                people.forEach((person, index) => {
                    const row = document.createElement("div");
                    row.className = "heart-row";
                    row.style.animationDelay = `${index * 0.1}s`;

                    // If fantasy theme, add floating butterflies and sparkling stars
                    if (theme === "fantasy") {
                        // Butterflies
                        const b1 = document.createElement("div");
                        b1.className = "butterfly b1";
                        b1.textContent = "🦋";
                        const b2 = document.createElement("div");
                        b2.className = "butterfly b2";
                        b2.textContent = "🦋";
                        const b3 = document.createElement("div");
                        b3.className = "butterfly b3";
                        b3.textContent = "🦋";
                        row.appendChild(b1);
                        row.appendChild(b2);
                        row.appendChild(b3);

                        // Stars (Sternchen)
                        const s1 = document.createElement("div");
                        s1.className = "star s1";
                        s1.textContent = "✦";
                        const s2 = document.createElement("div");
                        s2.className = "star s2";
                        s2.textContent = "✦";
                        const s3 = document.createElement("div");
                        s3.className = "star s3";
                        s3.textContent = "✦";
                        const s4 = document.createElement("div");
                        s4.className = "star s4";
                        s4.textContent = "✦";
                        row.appendChild(s1);
                        row.appendChild(s2);
                        row.appendChild(s3);
                        row.appendChild(s4);
                    }

                    // Avatar
                    const avatarWrapper = document.createElement("div");
                    avatarWrapper.className = "avatar-wrapper";

                    const avatarGlow = document.createElement("div");
                    avatarGlow.className = "avatar-glow";
                    avatarGlow.style.background = `conic-gradient(from 0deg, ${heartColor}66, ${heartColor}1A, ${heartColor}66)`;

                    const avatar = document.createElement("img");
                    avatar.className = "avatar";
                    avatar.src = person.imageUrl || DEFAULT_AVATAR;
                    avatar.alt = person.name;
                    avatar.onerror = function() { this.src = DEFAULT_AVATAR; };
                    avatar.style.borderColor = `${heartColor}33`;

                    avatarWrapper.appendChild(avatarGlow);
                    avatarWrapper.appendChild(avatar);

                    // Name (only if set)
                    let nameLabel = null;
                    if (person.name && person.name !== "Unbekannt") {
                        nameLabel = document.createElement("span");
                        nameLabel.className = "name-label";
                        nameLabel.textContent = person.name;
                    }

                    // Hearts
                    const heartsGroup = document.createElement("div");
                    heartsGroup.className = "hearts-group";

                    if (maxHearts <= 10) {
                        for (let i = 0; i < maxHearts; i++) {
                            const heartHtml = i < person.currentHearts ? HEART_SVG_FILLED : HEART_SVG_EMPTY;
                            const wrapper = document.createElement("span");
                            wrapper.innerHTML = heartHtml;
                            // Apply custom color
                            const svgEl = wrapper.querySelector("svg path");
                            if (svgEl && i < person.currentHearts) {
                                svgEl.setAttribute("fill", heartColor);
                            }
                            heartsGroup.appendChild(wrapper.firstChild);
                        }
                    } else {
                        // Compact style for many hearts
                        const wrapper = document.createElement("span");
                        wrapper.innerHTML = HEART_SVG_FILLED;
                        const svgEl = wrapper.querySelector("svg path");
                        if (svgEl) svgEl.setAttribute("fill", heartColor);
                        heartsGroup.appendChild(wrapper.firstChild);

                        const multiplier = document.createElement("span");
                        multiplier.className = "hearts-multiplier";
                        multiplier.textContent = `x${person.currentHearts}`;
                        multiplier.style.cssText = `font-size: 20px; font-weight: 900; color: ${heartColor}; margin-left: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;`;
                        
                        if (theme === "fantasy") {
                            multiplier.style.textShadow = `0 0 6px ${heartColor}, 0 2px 4px rgba(0,0,0,0.8)`;
                            multiplier.style.color = "#ffffff";
                        }
                        
                        heartsGroup.appendChild(multiplier);
                    }

                    row.appendChild(avatarWrapper);
                    if (nameLabel) row.appendChild(nameLabel);
                    row.appendChild(heartsGroup);
                    containerEl.appendChild(row);
                });
            }
        }
    </script>
</body>
</html>
