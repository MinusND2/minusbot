<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Stream Goal Overlay</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../app-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .goal-wrapper {
            width: 100%;
            max-width: 500px;
            background: rgba(10, 15, 12, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.5s ease;
        }

        .goal-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .goal-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .goal-stats {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .goal-pct {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 6px;
        }

        .progress-track {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            transition: width 0.8s cubic-bezier(0.19, 1, 0.22, 1), background-color 0.5s ease, box-shadow 0.5s ease;
            position: relative;
        }

        /* Inner glow/sheen effect */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 100%
            );
            animation: progress-sheen 3s infinite linear;
            border-radius: 50px;
        }

        @keyframes progress-sheen {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="goal-wrapper" id="wrapper">
        <div class="goal-info">
            <h2 class="goal-title" id="title">GOAL</h2>
            <div class="goal-stats" id="stats">
                <span id="current">0</span>/<span id="target">100</span>
                <span class="goal-pct" id="pct">0%</span>
            </div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="fill"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('profileId');

        if (!profileId) {
            document.body.innerHTML = "<div style='color: white; font-size: 20px; font-weight: 600; padding: 20px; background: rgba(0,0,0,0.8); border-radius: 10px;'>Fehlende profileId in der URL.</div>";
        } else {
            // Initialize Firebase
            if (!firebase.apps.length) {
                firebase.initializeApp(window.BINGO_CONFIG.firebaseConfig);
            }
            const db = firebase.database();

            const wrapperEl = document.getElementById("wrapper");
            const titleEl = document.getElementById("title");
            const currentEl = document.getElementById("current");
            const targetEl = document.getElementById("target");
            const pctEl = document.getElementById("pct");
            const fillEl = document.getElementById("fill");

            db.ref(`general_profiles/${profileId}/goal`).on('value', (snapshot) => {
                const data = snapshot.val() || {};

                const title = data.title || "GOAL";
                const current = parseInt(data.current, 10) || 0;
                const target = parseInt(data.target, 10) || 100;
                const color = data.color || "#22c55e";

                titleEl.textContent = title.toUpperCase();
                currentEl.textContent = current;
                targetEl.textContent = target;

                // Calculate percentage
                const percentage = target > 0 ? Math.min(100, Math.max(0, Math.round((current / target) * 100))) : 0;
                pctEl.textContent = `${percentage}%`;

                // Update styling & fill width
                fillEl.style.width = `${percentage}%`;
                fillEl.style.backgroundColor = color;
                fillEl.style.boxShadow = `0 0 10px ${color}80`; // Soft glow
                wrapperEl.style.borderColor = `${color}33`; // 20% opacity border
            });
        }
    </script>
</body>
</html>
