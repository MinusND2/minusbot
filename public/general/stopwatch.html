<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Stream Stopwatch Overlay</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../app-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .stopwatch-container {
            text-align: center;
            background: rgba(10, 18, 15, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 280px;
            transition: border-color 0.5s ease;
        }

        .stopwatch-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            transition: color 0.5s ease;
        }

        .stopwatch-time {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            margin: 0;
            text-shadow: 0 0 15px currentColor;
        }
    </style>
</head>
<body>
    <div class="stopwatch-container" id="container">
        <h1 class="stopwatch-title" id="title">ZEIT</h1>
        <div class="stopwatch-time" id="time">00:00</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('profileId');

        if (!profileId) {
            document.body.innerHTML = "<div style='color: white; font-size: 18px; font-weight: 600; padding: 20px; background: rgba(0,0,0,0.8); border-radius: 10px;'>Fehlende profileId in der URL.</div>";
        } else {
            if (!firebase.apps.length) {
                firebase.initializeApp(window.BINGO_CONFIG.firebaseConfig);
            }
            const db = firebase.database();
            
            const titleEl = document.getElementById("title");
            const timeEl = document.getElementById("time");
            const containerEl = document.getElementById("container");

            let minutes = 0;
            let baseTime = 0;
            let accumulatedTime = 0;
            let isRunning = false;
            let accentColor = "#00e5ff";

            db.ref(`general_profiles/${profileId}/stopwatch`).on('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                titleEl.textContent = (data.title || "ZEIT").toUpperCase();
                accentColor = data.accentColor || "#00e5ff";
                
                timeEl.style.color = accentColor;
                containerEl.style.borderColor = `${accentColor}33`;
                
                minutes = data.minutes || 0;
                baseTime = data.baseTime || 0;
                accumulatedTime = data.accumulatedTime || 0;
                isRunning = !!data.isRunning;

                updateDisplay();
            });

            function updateDisplay() {
                let totalSeconds = minutes * 60;
                let elapsedSeconds = 0;

                if (isRunning) {
                    const elapsed = (Date.now() - baseTime) / 1000;
                    elapsedSeconds = totalSeconds + (accumulatedTime / 1000) + elapsed;
                } else {
                    elapsedSeconds = totalSeconds + (accumulatedTime / 1000);
                }

                const h = Math.floor(elapsedSeconds / 3600);
                const m = Math.floor((elapsedSeconds % 3600) / 60);
                const s = Math.floor(elapsedSeconds % 60);

                if (h > 0) {
                    timeEl.textContent = h + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                } else {
                    timeEl.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                }
            }

            setInterval(() => {
                if (isRunning) {
                    updateDisplay();
                }
            }, 200);
        }
    </script>
</body>
</html>
